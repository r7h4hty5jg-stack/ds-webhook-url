name: Random image every 2 hours
on:
  schedule:
    - cron: "0 */2 * * *"   # каждые 2 часа (время UTC)
  workflow_dispatch:          # кнопка ручного запуска для теста
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Send random image to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_IMAGE_URL }}
        run: |
          pip install requests
          python - <<'EOF'
          import os, random, requests
          def meme():
              d = requests.get("https://meme-api.com/gimme/wholesomememes", timeout=10).json()
              return d["url"], f"😄 {d['title']}"
          def dog():
              m = requests.get("https://dog.ceo/api/breeds/image/random", timeout=10).json()["message"]
              return m, "🐶 doggo"
          def cat():
              u = requests.get("https://api.thecatapi.com/v1/images/search", timeout=10).json()[0]["url"]
              return u, "🐱 kitty"
          url, cap = random.choice([meme])()
          requests.post(os.environ["WEBHOOK_URL"], json={"content": f"{cap}\n{url}"})
          EOF
