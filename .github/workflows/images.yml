name: Random image every 2 hours

on:
  schedule:
    - cron: "0 */2 * * *"   # каждые 2 часа (время UTC)
  workflow_dispatch:        # кнопка ручного запуска для теста

permissions:
  contents: write           # нужно, чтобы коммитить историю обратно в репозиторий

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Send random image to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_IMAGE_URL }}
        run: |
          pip install requests
          python - <<'EOF'
          import os, json, random, pathlib, requests

          SUBS = ["anime_irl", "goodanimemes", "wholesomeanimemes",
                  "AnimeMILFS", "Ghibli",
                  "AnimeMilfLvrs",
                  "hentainmanga", "Hentai__videos", "HentaiiGooning",
                  "MilfHentai2"]

          HISTORY = pathlib.Path("seen.json")
          seen = json.loads(HISTORY.read_text()) if HISTORY.exists() else []

          def candidates(sub):
              """Берём у meme-api пачку из 50 постов вместо одного."""
              url = f"https://meme-api.com/gimme/{sub}/50"
              try:
                  data = requests.get(url, timeout=15).json()
              except Exception as e:
                  print(f"не смог прочитать r/{sub}: {e}")
                  return []
              memes = data.get("memes")
              if not memes:
                  print(f"r/{sub}: пустой ответ ({data.get('message', 'нет данных')})")
                  return []
              return [{"id": m["postLink"], "title": m["title"], "url": m["url"]} 
              for m in memes if not m.get(" ")]

          # идём по сабреддитам в случайном порядке, берём первый с новыми постами
          random.shuffle(SUBS)
          post = None
          for sub in SUBS:
              fresh = [p for p in candidates(sub) if p["id"] not in seen]
              if fresh:
                  post = random.choice(fresh)
                  print(f"выбран r/{sub}, свежих вариантов: {len(fresh)}")
                  break
              print(f"r/{sub}: всё уже было, пробую следующий")

          if post is None:
              print("Новых картинок не нашлось — пропускаю запуск")
              raise SystemExit(0)

          requests.post(os.environ["WEBHOOK_URL"],
                        json={"content": f"{post['title']}\n{post['url']}"},
                        timeout=15)
          print(f"отправлено: {post['url']}")

          seen.append(post["id"])
          HISTORY.write_text(json.dumps(seen[-400:]))   # помним последние 400
          EOF

      - name: Save history
        run: |
          if [ ! -f seen.json ]; then
            echo "seen.json не создан — сохранять нечего"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet && echo "изменений нет" && exit 0
          git commit -m "update seen history"
          git push
