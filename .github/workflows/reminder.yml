name: Weekly redeem reminder
on:
  schedule:
    - cron: "0 9 * * 1"   # каждый понедельник в 09:00 UTC
  workflow_dispatch:        # плюс кнопка "запустить вручную" для теста
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord message
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content": "🎁 Проверь новый redeem-код: https://x.com/JuicychatAI"}' \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
