name: Weekly redeem reminder
on:
  schedule:
    - cron: "0 9 * * 1"   # каждый понедельник в 09:00 UTC
  workflow_dispatch:        # плюс кнопка "запустить вручную" для теста
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord message
        run: |
          cat > payload.json <<'EOF'
          {"content": "Don't forget to grab this week's redeem code: https://x.com/service"}
          EOF
          curl -H "Content-Type: application/json" -d @payload.json ${{ secrets.DISCORD_WEBHOOK_URL }}
